[project]
name = "pulse"
version = "0.1.0"
description = "Pulse — AI operations platform demo: sales pulse, documents, knowledge, integrations, agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "aiogram>=3.15",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.2",
    "reportlab>=4.2",
    "pypdf>=5.1",
    "snowballstemmer>=2.2",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"pulse/seed/*" = ["S311"]  # seeded demo data, not cryptography
"pulse/seed/call_scripts.py" = ["E501"]  # dialogue lines read better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
