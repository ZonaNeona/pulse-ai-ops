# HTTP: ACME challenge and HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name demo.shvarev-demo.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Static SPA + FastAPI proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.shvarev-demo.ru;

    ssl_certificate /etc/letsencrypt/live/demo.shvarev-demo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.shvarev-demo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/pulse/apps/web/dist;
    index index.html;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # FastAPI API and SSE/WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # SPA history routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    access_log /var/log/nginx/pulse-demo-access.log;
    error_log /var/log/nginx/pulse-demo-error.log warn;
}
